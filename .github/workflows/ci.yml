name: Verify coach pilot
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coach-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - run: npm run format:check
      - name: Verify dynamic shard inventory
        run: npm run test:inventory
      - run: npm audit --omit=dev --audit-level=high
  tests:
    name: Serial tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - run: npm run test:shard -- ${{ matrix.shard }}
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/native-image
      - name: Verify real immutable native pair and isolated runtime
        run: SKILLS_NATIVE_TEST_IMAGE="$NATIVE_TEST_IMAGE" NATIVE_DOCKER_TEST=1 npx tsx --test --test-concurrency=1 tests/native-deployment.test.ts tests/native-runtime.test.ts tests/native-startup-tools.test.ts tests/native-pi-path.test.ts tests/native-terminal.test.ts tests/skills-native.test.ts tests/native-attachments-runtime.test.ts tests/native-attachments-pi.test.ts tests/native-session-docker.test.ts tests/native-account-memory-docker.test.ts tests/autonomy-headless-docker.test.ts tests/autonomy-correction-docker.test.ts
  workspace:
    # Workspace mode runs Pi without Docker; prove it on both platforms.
    name: Workspace sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/prepare
      - shell: bash
        run: npx tsx --test --test-concurrency=1 --test-force-exit tests/workspace-sandbox.test.ts
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/native-image
      - run: npm run test:package
  updater:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/native-image
      - name: Verify packed source upgrade, rollback and restart
        run: node scripts/updater-package-smoke.mjs
      - name: Qualify protocol-2 published-package full chain
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/packed-release.json"
          export COACH_RELEASE_PACKAGE="$RUNNER_TEMP/$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/packed-release.json"))[0].filename')"
          export RELEASE_NATIVE_PACKAGE="$COACH_RELEASE_PACKAGE"
          npx tsx --test --test-concurrency=1 tests/release-native.test.ts tests/release-binding.test.ts
          COACH_RELEASE_CYCLES=1 node scripts/release-chain-smoke.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      # Keep browser fixtures serial within their isolated runner.
      - run: npm run test:browser
      - run: npm run test:coach-browser
      - run: npm run test:updates-browser
      - name: Verify update status and owner-schedule browser fixtures
        run: npx tsx scripts/update-status-browser-smoke.ts
      - name: Verify non-disruptive preview beside live Coach
        run: npx tsx scripts/preview-browser-smoke.ts
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/native-image
      - name: Build private non-root Docker image
        shell: bash
        run: |
          git archive HEAD | docker build \
            --build-arg KATAFIT_BUILD_REVISION="$(git rev-parse HEAD)" \
            -t katafit-coach:qa -
      - name: Verify Docker ownership and persistent restart
        run: COACH_EXPECTED_REVISION="$(git rev-parse HEAD)" node scripts/docker-smoke.mjs
  archives:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/prepare
      - name: Build one self-contained archive per platform
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends patchelf >/dev/null
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          for platform in linux-x64 linux-arm64 win-x64; do
            node scripts/platform-archive.mjs "$RUNNER_TEMP"/katafit-coach-*.tgz "$platform" "$RUNNER_TEMP/archives"
          done
          ls -l "$RUNNER_TEMP/archives"
      - name: Run the Linux archive with nothing from the system
        shell: bash
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/run"; mkdir -p "$run/home"
          tar -xzf "$RUNNER_TEMP"/archives/coach-*-linux-x64.tar.gz -C "$run"
          coach="$run/katafit-coach"
          clean() { env -i HOME="$run/home" PATH=/usr/sbin:/usr/bin:/sbin:/bin "$@"; }
          test "$(clean "$coach/node/bin/node" -v)" = v26.10.0
          # Node finds the bundled libatomic relative to itself.
          readelf -d "$coach/node/bin/node" | grep -F 'RUNPATH' | grep -qF '$ORIGIN/../lib'
          test -f "$coach/node/lib/libatomic.so.1"
          clean "$coach/bin/katafit-coach" help | grep -q "katafit-coach start"
          # Native modules load from the bundled runtime.
          (cd "$coach/app" && clean "$coach/node/bin/node" -e 'import("sharp").then((s) => s.default({ create: { width: 2, height: 2, channels: 3, background: "red" } }).png().toBuffer()).then((b) => { if (!b.length) process.exit(1); })')
      - name: Other platforms carry their own runtime and native modules
        shell: bash
        run: |
          set -euo pipefail
          arm="$RUNNER_TEMP/arm"; mkdir -p "$arm"
          tar -xzf "$RUNNER_TEMP"/archives/coach-*-linux-arm64.tar.gz -C "$arm"
          file "$arm/katafit-coach/node/bin/node" | grep -q "ARM aarch64"
          test -d "$arm/katafit-coach/app/node_modules/@img/sharp-linux-arm64"
          unzip -l "$RUNNER_TEMP"/archives/coach-*-win-x64.zip > "$RUNNER_TEMP/win.txt"
          for entry in katafit-coach/node/node.exe katafit-coach/katafit-coach.cmd katafit-coach/katafit-coach-boot.cmd \
            katafit-coach/app/dist/boot.js katafit-coach/app/node_modules/@img/sharp-win32-x64/; do
            grep -qF "$entry" "$RUNNER_TEMP/win.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: coach-archives-${{ github.sha }}
          path: ${{ runner.temp }}/archives
          retention-days: 7
  windows:
    # Coach on Windows: the archive under its bootstrap like an installed copy,
    # then the bootstrap, handover and workspace upgrade suites natively.
    needs: archives
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/prepare
      - uses: actions/download-artifact@v4
        with:
          name: coach-archives-${{ github.sha }}
          path: ${{ runner.temp }}/archives
      - name: Run the Windows archive under its bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP" && unzip -q archives/coach-*-win-x64.zip -d run
          run/katafit-coach/node/node.exe "$GITHUB_WORKSPACE/scripts/windows-smoke.mjs" "$RUNNER_TEMP/run/katafit-coach" "$RUNNER_TEMP/home"
      - name: Bootstrap, handover and upgrade suites on Windows
        shell: bash
        run: npx tsx --test --test-concurrency=1 --test-force-exit tests/boot.test.ts tests/boot-handover.test.ts tests/handover-resume.test.ts tests/workspace-upgrades.test.ts
      - name: Install, reinstall and restart as a standard Windows user
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:PUBLIC ('coach-smoke-' + [guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $root
          $password = ConvertTo-SecureString (([guid]::NewGuid().ToString('N')) + 'aA!9') -AsPlainText -Force
          $user = New-LocalUser -Name 'coach-smoke' -Password $password -AccountNeverExpires
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user
          $credential = New-Object Management.Automation.PSCredential ("$env:COMPUTERNAME\coach-smoke", $password)
          try {
            Copy-Item "$env:RUNNER_TEMP\archives\coach-*-win-x64.zip" "$root\archive.zip"
            Copy-Item install.ps1 "$root\install.ps1"
            Copy-Item scripts/windows-installer-smoke.ps1 "$root\smoke.ps1"
            $null = & icacls.exe $root /grant "*$($user.SID.Value):(OI)(CI)F" /T
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the smoke folder.' }
            $arguments = '-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $root + '\smoke.ps1" -Archive "' + $root + '\archive.zip" -Installer "' + $root + '\install.ps1" -Root "' + $root + '"'
            $process = Start-Process powershell.exe -Credential $credential -LoadUserProfile -ArgumentList $arguments -Wait -PassThru -RedirectStandardOutput "$root\stdout.log" -RedirectStandardError "$root\stderr.log"
            # Installer output contains a disposable local admin URL; redact it.
            foreach ($log in @('stdout.log', 'stderr.log')) {
              (Get-Content "$root\$log" -Raw) -replace '(http://127\.0\.0\.1:\d+/#)[A-Za-z0-9_-]+', '$1[redacted]' | Write-Host
            }
            if ($process.ExitCode -ne 0) { throw "Windows installer smoke exited $($process.ExitCode)" }
          } finally {
            Remove-LocalUser -Name 'coach-smoke' -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
  installer:
    # The one-line Linux installer, from this source's archive, as an ordinary
    # user in clean containers with nothing preinstalled.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/prepare
      - name: Build the Linux archive from this source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends patchelf >/dev/null
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          node scripts/platform-archive.mjs "$RUNNER_TEMP"/katafit-coach-*.tgz linux-x64 "$RUNNER_TEMP/archives"
      - name: Install, run and reinstall in clean containers
        shell: bash
        run: |
          set -euo pipefail
          for image in ubuntu:24.04 debian:12 fedora:42; do
            echo "::group::$image"
            # An ordinary user in a clean container; docker exec switches to
            # it, since minimal images may not have su.
            docker run -d --name smoke \
              -v "$PWD/install.sh:/install.sh:ro" \
              -v "$PWD/scripts/installer-smoke.sh:/smoke.sh:ro" \
              -v "$RUNNER_TEMP/archives:/archives:ro" \
              "$image" sleep infinity >/dev/null
            docker exec smoke useradd -m coach
            docker exec -u coach -e HOME=/home/coach -w /home/coach smoke sh /smoke.sh
            docker rm -f smoke >/dev/null
            echo "::endgroup::"
          done
  verify:
    # Stable required check: skipped, cancelled and failed dependencies all fail.
    if: always()
    needs: [build, tests, native, workspace, installer, windows, package, updater, browser, docker, archives]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every qualification gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; results=json.loads(os.environ["NEEDS_JSON"]); assert len(results)==11 and all(job["result"]=="success" for job in results.values()), results'
