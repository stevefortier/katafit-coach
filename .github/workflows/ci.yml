name: Verify coach pilot
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coach-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - run: npm run format:check
      - name: Verify dynamic shard inventory
        run: npm run test:inventory
      - run: npm audit --omit=dev --audit-level=high
  tests:
    name: Serial tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - run: npm run test:shard -- ${{ matrix.shard }}
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/native-image
      - name: Verify real immutable native pair and isolated runtime
        run: SKILLS_NATIVE_TEST_IMAGE="$NATIVE_TEST_IMAGE" NATIVE_DOCKER_TEST=1 npx tsx --test --test-concurrency=1 tests/native-deployment.test.ts tests/native-runtime.test.ts tests/native-startup-tools.test.ts tests/native-pi-path.test.ts tests/native-terminal.test.ts tests/skills-native.test.ts tests/native-attachments-runtime.test.ts tests/native-attachments-pi.test.ts tests/native-session-docker.test.ts tests/native-account-memory-docker.test.ts tests/autonomy-headless-docker.test.ts tests/autonomy-correction-docker.test.ts
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/native-image
      - run: npm run test:package
  updater:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/native-image
      - name: Verify packed source upgrade, rollback and restart
        run: node scripts/updater-package-smoke.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      # Keep browser fixtures serial within their isolated runner.
      - run: npm run test:browser
      - run: npm run test:coach-browser
      - run: npm run test:updates-browser
      - name: Verify update status and owner-schedule browser fixtures
        run: npx tsx scripts/update-status-browser-smoke.ts
      - name: Verify non-disruptive preview beside live Coach
        run: npx tsx scripts/preview-browser-smoke.ts
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the unchanged PR head, not GitHub's moving synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Frozen protocol-1 launcher compatibility history.
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/native-image
      - name: Build private non-root Docker image
        shell: bash
        run: |
          git archive HEAD | docker build \
            --build-arg KATAFIT_BUILD_REVISION="$(git rev-parse HEAD)" \
            -t katafit-coach:qa -
      - name: Verify Docker ownership and persistent restart
        run: COACH_EXPECTED_REVISION="$(git rev-parse HEAD)" node scripts/docker-smoke.mjs
  verify:
    # Stable required check: skipped, cancelled and failed dependencies all fail.
    if: always()
    needs: [build, tests, native, package, updater, browser, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every qualification gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; results=json.loads(os.environ["NEEDS_JSON"]); assert len(results)==7 and all(job["result"]=="success" for job in results.values()), results'
