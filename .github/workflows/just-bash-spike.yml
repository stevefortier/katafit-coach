name: just-bash sandbox spike
# Spike only: Pi's own tools backed by just-bash, and the real Pi CLI under
# Node's permission model, on Linux and Windows. Changes nothing shipped.
on:
  workflow_dispatch:
  pull_request:
    paths: ["spike/just-bash/**", ".github/workflows/just-bash-spike.yml"]
permissions:
  contents: read
jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: spike/just-bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.10.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tools backed by just-bash (work and escapes)
        run: node escape-test.mjs
      - name: Pi CLI under the permission model (workers allowed)
        if: always()
        run: node run-pi.mjs --allow-worker
      - name: Pi CLI under the permission model (no workers; python3 unavailable)
        if: always()
        run: node run-pi.mjs
